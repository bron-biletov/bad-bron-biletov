# Скопируйте этот файл в config.yaml и заполните своими данными.
# config.yaml добавлен в .gitignore и никогда не попадёт в git.

account:
  # Логин/E-mail и пароль от личного кабинета на https://pass.rw.by/ru/
  # Вместо хранения пароля в файле можно задать переменные окружения
  # RW_LOGIN и RW_PASSWORD — они имеют приоритет над значениями отсюда.
  login: ""
  password: ""

# Данные пассажира, на которого оформляется билет
passenger:
  last_name: "Иванов"
  first_name: "Иван"
  middle_name: "Иванович"
  # Тип документа: passport / id_card / birth_certificate ...
  document_type: "passport"
  document_number: ""
  phone: "+375291234567"

# Параметры искомого рейса
route:
  from_station: "Минск-Пассажирский"
  to_station: "Брест-Центральный"
  # Коды ЕСР станций (необязательно, но сильно повышают надёжность поиска).
  # Их можно взять из ссылок вида .../route/?...&from_esr=140210&...&to_esr=130007
  from_esr: null
  to_esr: null
  # Дата поездки в формате ГГГГ-ММ-ДД
  date: "2026-10-01"
  # Номер поезда, например "105Б". Если не задан — бот будет рассматривать
  # все поезда на этом направлении и в эту дату.
  train_number: null
  # Ожидаемое время отправления в формате ЧЧ:ММ (необязательно, помогает
  # выбрать нужный рейс, если на маршруте несколько поездов).
  departure_time: null
  # Желаемый тип вагона/места (необязательно): "Купе", "Плацкарт", "Сидячий" и т.д.
  car_type: null

polling:
  # Диапазон интервала опроса сайта в секундах (случайная пауза внутри диапазона,
  # чтобы не создавать регулярную предсказуемую нагрузку на сайт).
  interval_min_seconds: 15
  interval_max_seconds: 30
  # После скольких подряд ошибок сети/сайта сделать длинную паузу (секунды)
  error_backoff_seconds: 120
  # Останавливаться ли после первого успешного бронирования
  stop_after_first_booking: true

browser:
  # false — показывать окно браузера (полезно на первом запуске и для отладки),
  # true — работать в фоне без окна.
  headless: false
  # Файл, куда сохраняется сессия (куки) после первого успешного логина,
  # чтобы не логиниться каждый раз заново.
  storage_state_path: "storage_state.json"

notifications:
  # Звуковой сигнал при успешном бронировании
  sound_enabled: true
  # Сколько раз подряд подать сигнал
  sound_repeats: 5
